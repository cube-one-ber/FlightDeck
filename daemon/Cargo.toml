[package]
name = "flightdeck"
version = "0.1.0"
edition = "2021"
description = "FlightDeck: spaceflight campaign daemon and CLI for Omarchy"
license = "MIT"

[[bin]]
name = "flightdeck"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
toml = "0.8"
